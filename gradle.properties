org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true

# AGP 9 sets up a Compose Preview task for every build type, and it fails to set up without unit tests.
# Editors list every task when they load the project, so keep unit tests on for release too.
android.onlyEnableUnitTestForTheTestedBuildType=false
